query getTags {
  user {
    tags {
      name
      color
      _id
    }
  }
}

mutation updateTag(
  $tagId: ID!
  $color: HexColorCode!
  $name: String!
  $description: String!
) {
  updateTag(
    tagId: $tagId
    input: { name: $name, description: $description, color: $color }
  ) {
    _id
    name
    description
    color
  }
}

mutation createTag(
  $name: String!
  $description: String
  $color: HexColorCode!
) {
  createTag(input: { name: $name, description: $description, color: $color }) {
    _id
    name
    description
    color
  }
}
