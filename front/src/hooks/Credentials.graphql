fragment basicPublicUserFields on User {
  displayName
  username
  deletedAt
}

fragment extendedPublicUserFields on User {
  ...basicUserFields
  _id
  email
}

fragment basicUserFields on User {
  _id
  displayName
  email
  createdAt
  updatedAt
  firstName
  lastName
  institution
}

fragment detailedUserFields on User {
  authTypes

  acquintances {
    _id
    ...basicUserFields
  }

  permissions {
    scope
    roles
    user {
      _id
      ...basicUserFields
    }
  }

  workspaces {
    _id
    name
    color
  }
}

fragment authProviderFields on User {
  authProviders {
    humanid {
      id
      updatedAt
    }
    hypothesis {
      id
      updatedAt
    }
    zotero {
      id
      token
      updatedAt
    }
  }
}

mutation logoutMutation {
  logout {
    ...basicUserFields
  }
}

mutation deleteAccount {
  deleteAccount
}

query getFullUserProfile {
  user {
    ...basicUserFields
    ...detailedUserFields
    ...authProviderFields
  }
}

mutation createUser($input: CreateUserInput!) {
  createUser(input: $input) {
    ...basicUserFields
  }
}

mutation createUserWithAuth(
  $service: AuthTokenService!
  $input: CreateUserWithAuthInput!
) {
  createUserWithAuth(service: $service, input: $input)
}

mutation updateUser($input: UpdateUserInput!) {
  updateUser(input: $input) {
    ...basicUserFields
    ...authProviderFields
  }
}

mutation changePassword($input: ChangePasswordInput!) {
  changePassword(input: $input) {
    ...detailedUserFields
  }
}

mutation setAuthTokenMutation($service: AuthTokenService!) {
  setAuthToken(service: $service) {
    ...authProviderFields
  }
}

mutation unsetAuthTokenMutation($service: AuthTokenService!) {
  unsetAuthToken(service: $service) {
    ...authProviderFields
  }
}
